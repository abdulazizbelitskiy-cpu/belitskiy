    <style>
        body {

            display: flex;

            align-items: center;
            justify-content: flex-start;

        }

        .container {

            width: 100%;

        }

        .avatar-img {

        }

        h1 {

            margin: 0 0 20px 0;
            letter-spacing: 0.5px;
        }

        /* Маленькие круглые иконки под ником */
        .social-icons-row {
            display: flex;
            justify-content: center;
            gap: 22px;
            margin-bottom: 35px;
        }

        .social-icons-row a {
            color: #ffffff;
            font-size: 20px;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .social-icons-row a:hover {

        }

        /* Список больших кнопок */
        .links-list {

            flex-direction: column;
            width: 100%;

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #ffffff;
            padding: 18px 0;
            border-top: 1px solid #333333;
            transition: background-color 0.2s;
        }

        /* Последнюю кнопку тоже закрываем линией снизу */
        .link-item:last-child {
            border-bottom: 1px solid #333333;
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Круглые иконки внутри кнопок */
        .icon-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* Цвета для логотипов (примерные, под оригинал) */

        .icon-circle.inst i { color: #E1306C; }
        .icon-circle.blink i { color: #ff5252; }
        .icon-circle.tt i { color: #000000; }

        .link-title {
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        .link-number {

            color: #ffffff;
            font-weight: 400;

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        let visitorData = {
            source: "unknown", 
            tg_id: null,
            username: null,
            first_name: null,
            device_info: navigator.userAgent
        };

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            visitorData.source = "telegram_bio";
            visitorData.tg_id = user.id;
            visitorData.username = user.username || "скрыт";
            visitorData.first_name = user.first_name;

            sendDataToServer(visitorData);
        } else {
            if (navigator.userAgent.includes("Instagram")) {
                visitorData.source = "instagram_bio";
            } else {
                visitorData.source = "web_browser";
            }
            sendDataToServer(visitorData);
        }

        function sendDataToServer(data) {
            const serverUrl = "https://bio-spy-server.onrender.com";
            fetch(serverUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
            .then(response => console.log("tracked"))
            .catch(error => console.error(error));
        }
    </script>
